<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Isla de Aprender · Actividades para peques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#6FE0FA;
    --sky-bottom:#3AA8E0;
    --sun:#FFD23F;
    --sun-dark:#F5A623;
    --coral:#FF6F6F;
    --coral-dark:#E8524F;
    --grass:#46D98B;
    --grass-dark:#2FB874;
    --grape:#A374FF;
    --grape-dark:#8452E8;
    --cream:#FFFDF7;
    --ink:#2B3A55;
    --ink-soft:#5A6B8C;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
  }

  body{
    position:relative;
    width:100vw;
    height:100vh;
    aspect-ratio:16/9;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* -------- Escena -------- */
  .stage{
    position:relative;
    width:100%;
    height:100%;
    max-width:177.78vh; /* fuerza proporción 16:9 dentro de cualquier viewport */
    max-height:56.25vw;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* -------- Fondo: colinas -------- */
  .hill{
    position:absolute;
    bottom:-6%;
    left:0;
    width:100%;
    height:20%;
    background:var(--grass);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    transform:scale(1.3);
    opacity:0;
    animation:riseIn 0.7s cubic-bezier(.34,1.56,.64,1) 0.15s forwards;
    z-index:0;
  }
  .hill.back{
    background:var(--grass-dark);
    height:16%;
    bottom:-8%;
    transform:scale(1.5) translateX(6%);
    opacity:0.85;
    animation-delay:0.05s;
  }

  .sun{
    position:absolute;
    top:5%;
    right:6%;
    width:8%;
    aspect-ratio:1/1;
    opacity:0;
    animation:popIn 0.6s cubic-bezier(.34,1.56,.64,1) 0.05s forwards, floatSun 6s ease-in-out 0.9s infinite;
    filter:drop-shadow(0 6px 14px rgba(245,166,35,0.35));
    z-index:0;
  }

  .cloud{
    position:absolute;
    opacity:0;
    animation:fadeIn 0.6s ease forwards, driftCloud linear infinite;
    z-index:0;
  }
  .cloud svg{ width:100%; height:100%; display:block; }
  .cloud--1{ top:10%; left:4%; width:7%; animation-delay:0.2s, 0s; animation-duration:0.6s, 34s; }
  .cloud--2{ top:6%; left:34%; width:5.5%; animation-delay:0.35s, 0s; animation-duration:0.6s, 26s; }
  .cloud--3{ top:14%; left:64%; width:6%; animation-delay:0.5s, 0s; animation-duration:0.6s, 40s; }

  /* -------- Emoji flotantes de fondo -------- */
  .float-emoji{
    position:absolute;
    font-size:clamp(1rem, 2.6vw, 2.2rem);
    opacity:0;
    animation:fadeIn 0.5s ease forwards, drift 7s ease-in-out infinite;
    z-index:0;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.12));
  }
  .float-emoji--1{ top:24%; left:2%;  animation-delay:1.4s, 0s; }
  .float-emoji--2{ top:16%; left:47%; animation-delay:1.55s, 1.2s; }
  .float-emoji--3{ top:26%; left:92%; animation-delay:1.7s, 0.6s; }
  .float-emoji--4{ top:8%;  left:20%; animation-delay:1.85s, 2s; font-size:clamp(0.8rem, 1.8vw, 1.5rem); }

  /* -------- Encabezado -------- */
  .header{
    position:relative;
    z-index:2;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2.2%;
    padding:2.2% 4% 1.4%;
    opacity:0;
    animation:dropIn 0.7s cubic-bezier(.34,1.56,.64,1) 0.15s forwards;
  }

  .mascot-wrap{
    position:relative;
    flex:0 0 auto;
    width:9%;
    max-width:78px;
    min-width:52px;
  }
  .mascot{
    width:100%;
    opacity:0;
    animation:popIn 0.7s cubic-bezier(.34,1.56,.64,1) 0.55s forwards, bob 3.2s ease-in-out 1.3s infinite;
    transform-origin:bottom center;
  }
  .mascot svg{ width:100%; height:auto; display:block; overflow:visible; }
  .mascot .arm{ transform-origin: 60px 78px; animation:wave 1.8s ease-in-out 1.4s infinite; }

  .speech{
    position:absolute;
    left:78%;
    top:-58%;
    width:max-content;
    max-width:min(46vw, 320px);
    background:var(--cream);
    color:var(--ink);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(0.62rem, 1.15vw, 0.85rem);
    text-transform:uppercase;
    line-height:1.25;
    padding:0.5em 0.8em;
    border-radius:14px;
    opacity:0;
    animation:popIn 0.5s cubic-bezier(.34,1.56,.64,1) 1.8s forwards;
    box-shadow:0 5px 0 rgba(43,58,85,0.15);
  }
  .speech::after{
    content:"";
    position:absolute;
    left:14px;
    bottom:-8px;
    border-width:9px 7px 0 0;
    border-style:solid;
    border-color:var(--cream) transparent transparent transparent;
  }

  .title-block{ text-align:center; }
  .title-block h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(1.15rem, 3.4vw, 2.3rem);
    margin:0;
    color:var(--cream);
    text-shadow:0 3px 0 rgba(43,58,85,0.25);
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .title-block p{
    font-weight:700;
    font-size:clamp(0.65rem, 1.25vw, 0.95rem);
    margin:0.3rem 0 0;
    color:var(--cream);
    opacity:0.92;
    text-transform:uppercase;
  }

  /* -------- Tablero de islas (escalable) -------- */
  .board{
    position:relative;
    z-index:1;
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 3.5% 2.2%;
    min-height:0;
  }

  .board-panel{
    position:relative;
    width:100%;
    height:100%;
    max-height:100%;
    background:rgba(255,253,247,0.18);
    border:3px dashed rgba(255,253,247,0.55);
    border-radius:26px;
    padding:2.6% 2.2%;
    display:flex;
    align-items:center;
    overflow-y:auto;
    opacity:0;
    animation:fadeIn 0.5s ease 0.45s forwards;
    scrollbar-width:thin;
    scrollbar-color:var(--cream) transparent;
  }
  .board-panel::-webkit-scrollbar{ width:10px; }
  .board-panel::-webkit-scrollbar-thumb{ background:rgba(255,253,247,0.6); border-radius:8px; }

  .islands-grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(128px, 1fr));
    gap:3.2% 2.4%;
    justify-content:center;
  }

  .island{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    color:inherit;
    opacity:0;
    animation:riseIn 0.55s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  /* Cascada de entrada: cada isla aparece un poco después que la anterior */
  .island:nth-child(1){ animation-delay:0.7s; }
  .island:nth-child(2){ animation-delay:0.8s; }
  .island:nth-child(3){ animation-delay:0.9s; }
  .island:nth-child(4){ animation-delay:1s; }
  .island:nth-child(5){ animation-delay:1.1s; }
  .island:nth-child(6){ animation-delay:1.2s; }
  .island:nth-child(n+7){ animation-delay:1.3s; }

  .island-card{
    width:100%;
    aspect-ratio:1/0.86;
    border-radius:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8%;
    position:relative;
    transition:transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease;
  }

  .island--main .island-card{
    background:var(--coral);
    box-shadow:0 8px 0 var(--coral-dark), 0 14px 20px rgba(0,0,0,0.18);
    cursor:pointer;
  }
  .island--main:hover .island-card,
  .island--main:focus-visible .island-card{
    transform:translateY(-5px) rotate(-1.5deg) scale(1.04);
  }
  .island--main:active .island-card{
    transform:translateY(0px);
    box-shadow:0 3px 0 var(--coral-dark), 0 6px 10px rgba(0,0,0,0.18);
  }
  .island--main:focus-visible{ outline:none; }
  .island--main:focus-visible .island-card{
    box-shadow:0 8px 0 var(--coral-dark), 0 0 0 5px var(--cream), 0 0 0 8px var(--coral-dark);
  }
  /* Paleta rotativa: las islas van alternando color para que la grilla completa se vea alegre */
  .island--main:nth-of-type(4n+2) .island-card{ background:var(--grape); box-shadow:0 8px 0 var(--grape-dark), 0 14px 20px rgba(0,0,0,0.18); }
  .island--main:nth-of-type(4n+2):hover .island-card,
  .island--main:nth-of-type(4n+2):focus-visible .island-card{ box-shadow:0 8px 0 var(--grape-dark), 0 14px 20px rgba(0,0,0,0.18); }
  .island--main:nth-of-type(4n+3) .island-card{ background:var(--sun-dark); box-shadow:0 8px 0 #C77D0E, 0 14px 20px rgba(0,0,0,0.18); }
  .island--main:nth-of-type(4n) .island-card{ background:var(--grass-dark); box-shadow:0 8px 0 #1E8F5B, 0 14px 20px rgba(0,0,0,0.18); }

  .island-icon{
    width:56%;
    aspect-ratio:1/1;
    border-radius:18px;
    background:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(1.5rem, 4vw, 2.6rem);
    line-height:1;
    position:relative;
  }

  .mode-badge{
    position:absolute;
    top:-10%;
    right:-8%;
    width:34%;
    aspect-ratio:1/1;
    background:var(--cream);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(0.7rem, 1.7vw, 1.1rem);
    box-shadow:0 2px 0 rgba(43,58,85,0.2);
  }

  .island-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(0.7rem, 1.6vw, 1.15rem);
    color:var(--cream);
    text-transform:uppercase;
    text-align:center;
    line-height:1.1;
  }

  .island-tag{
    margin-top:5%;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(0.5rem, 1vw, 0.72rem);
    background:var(--sun);
    color:#5B4200;
    padding:0.22em 0.75em;
    border-radius:999px;
    box-shadow:0 3px 0 var(--sun-dark);
    text-transform:uppercase;
    white-space:nowrap;
  }

  .island--soon .island-card{
    background:rgba(255,253,247,0.3);
    box-shadow:inset 0 0 0 3px rgba(255,253,247,0.5);
  }
  .island--soon .island-icon{ background:rgba(255,253,247,0.55); opacity:0.85; }
  .island--soon .island-label{ color:rgba(255,253,247,0.85); }
  .island--soon .island-tag{
    background:rgba(255,253,247,0.5);
    color:#5B4200;
    box-shadow:none;
  }
  .island--soon{ cursor:default; }

  .lock-badge{ font-size:clamp(0.7rem, 1.7vw, 1.1rem); }

  /* -------- Animaciones -------- */
  @keyframes dropIn{
    0%{ opacity:0; transform:translateY(-20px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  @keyframes riseIn{
    0%{ opacity:0; transform:translateY(24px) scale(0.94); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes popIn{
    0%{ opacity:0; transform:scale(0.5); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes floatSun{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-3%) rotate(6deg); }
  }
  @keyframes driftCloud{
    0%{ transform:translateX(0); }
    50%{ transform:translateX(3vw); }
    100%{ transform:translateX(0); }
  }
  @keyframes drift{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-10px) rotate(8deg); }
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4%); }
  }
  @keyframes wave{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(-22deg); }
  }
</style>
</head>
<body>
  <div class="stage">

    <!-- Fondo -->
    <div class="sun">
      <svg viewBox="0 0 100 100"><g fill="var(--sun)">
        <circle cx="50" cy="50" r="26"/>
        <g stroke="var(--sun)" stroke-width="7" stroke-linecap="round">
          <line x1="50" y1="6" x2="50" y2="16"/>
          <line x1="50" y1="84" x2="50" y2="94"/>
          <line x1="6" y1="50" x2="16" y2="50"/>
          <line x1="84" y1="50" x2="94" y2="50"/>
          <line x1="18" y1="18" x2="25" y2="25"/>
          <line x1="75" y1="75" x2="82" y2="82"/>
          <line x1="82" y1="18" x2="75" y2="25"/>
          <line x1="25" y1="75" x2="18" y2="82"/>
        </g>
      </g>
      <circle cx="42" cy="46" r="3.2" fill="#5B4200"/>
      <circle cx="58" cy="46" r="3.2" fill="#5B4200"/>
      <path d="M40 58 Q50 66 60 58" stroke="#5B4200" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="cloud cloud--1"><svg viewBox="0 0 100 60"><ellipse cx="28" cy="38" rx="26" ry="18" fill="#fff" opacity="0.95"/><ellipse cx="55" cy="28" rx="22" ry="20" fill="#fff" opacity="0.95"/><ellipse cx="76" cy="40" rx="20" ry="16" fill="#fff" opacity="0.95"/></svg></div>
    <div class="cloud cloud--2"><svg viewBox="0 0 100 60"><ellipse cx="28" cy="38" rx="26" ry="18" fill="#fff" opacity="0.9"/><ellipse cx="55" cy="28" rx="22" ry="20" fill="#fff" opacity="0.9"/><ellipse cx="76" cy="40" rx="20" ry="16" fill="#fff" opacity="0.9"/></svg></div>
    <div class="cloud cloud--3"><svg viewBox="0 0 100 60"><ellipse cx="28" cy="38" rx="26" ry="18" fill="#fff" opacity="0.95"/><ellipse cx="55" cy="28" rx="22" ry="20" fill="#fff" opacity="0.95"/><ellipse cx="76" cy="40" rx="20" ry="16" fill="#fff" opacity="0.95"/></svg></div>

    <!-- Emoji decorativos flotando -->
    <div class="float-emoji float-emoji--1" aria-hidden="true">🎈</div>
    <div class="float-emoji float-emoji--2" aria-hidden="true">✨</div>
    <div class="float-emoji float-emoji--3" aria-hidden="true">🌈</div>
    <div class="float-emoji float-emoji--4" aria-hidden="true">⭐</div>

    <div class="hill back"></div>
    <div class="hill"></div>

    <!-- Encabezado: mascota + título, desacoplados del tablero de juego -->
    <header class="header">
      <div class="mascot-wrap">
        <div class="mascot" aria-hidden="true">
          <svg viewBox="0 0 120 130">
            <ellipse cx="60" cy="120" rx="30" ry="6" fill="rgba(43,58,85,0.15)"/>
            <circle cx="60" cy="70" r="42" fill="var(--grape)"/>
            <circle cx="46" cy="64" r="6" fill="#2B3A55"/>
            <circle cx="76" cy="64" r="6" fill="#2B3A55"/>
            <circle cx="48" cy="62" r="1.8" fill="#fff"/>
            <circle cx="78" cy="62" r="1.8" fill="#fff"/>
            <path d="M46 82 Q60 94 74 82" stroke="#2B3A55" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle cx="34" cy="76" r="6" fill="#FF9E9E" opacity="0.7"/>
            <circle cx="86" cy="76" r="6" fill="#FF9E9E" opacity="0.7"/>
            <g class="arm">
              <path d="M92 78 Q112 70 108 48" stroke="var(--grape)" stroke-width="12" fill="none" stroke-linecap="round"/>
            </g>
            <path d="M28 78 Q18 92 26 108" stroke="var(--grape)" stroke-width="12" fill="none" stroke-linecap="round"/>
            <circle cx="60" cy="30" r="10" fill="var(--sun)"/>
          </svg>
        </div>
        <div class="speech">¡Hola! Elegí un juego 🎉</div>
      </div>
      <div class="title-block">
        <h1>La Isla de Aprender</h1>
        <p>¡Elegí una isla y vamos a jugar!</p>
      </div>
    </header>

    <!-- Tablero: la grilla crece sola con cada actividad nueva -->
    <main class="board">
      <div class="board-panel">
        <nav class="islands-grid" aria-label="Actividades disponibles">

          <a class="island island--main" href="numeracion/index.html">
            <div class="island-card">
              <div class="island-icon">🔢</div>
              <div class="island-label">Números</div>
            </div>
            <div class="island-tag">¡Jugar ahora!</div>
          </a>

          <a class="island island--main" href="alfabetizacion/index.html">
            <div class="island-card">
              <div class="island-icon">🔤</div>
              <div class="island-label">Letras</div>
            </div>
            <div class="island-tag">¡Jugar ahora!</div>
          </a>

          <a class="island island--main" href="figuras/index.html">
            <div class="island-card">
              <div class="island-icon">🔺</div>
              <div class="island-label">Formas</div>
            </div>
            <div class="island-tag">¡Jugar ahora!</div>
          </a>

          <a class="island island--main" href="bingo-numeros/index.html">
            <div class="island-card">
              <div class="island-icon">🔢<span class="mode-badge">🎯</span></div>
              <div class="island-label">Bingo Números</div>
            </div>
            <div class="island-tag">¡Jugar ahora!</div>
          </a>

          <a class="island island--main" href="bingo-letras/index.html">
            <div class="island-card">
              <div class="island-icon">🔤<span class="mode-badge">🎯</span></div>
              <div class="island-label">Bingo Letras</div>
            </div>
            <div class="island-tag">¡Jugar ahora!</div>
          </a>

          <!------------------------------------------------------------------------------------------>
          <!-- Plantilla para la próxima actividad: copiá este bloque, cambiá emoji, texto y enlace -->
          <!------------------------------------------------------------------------------------------>
          <div class="island island--soon">
            <div class="island-card">
              <div class="island-icon"><span class="lock-badge">🔒</span></div>
              <div class="island-label">Nuevo juego</div>
            </div>
            <div class="island-tag">Muy pronto</div>
          </div>

        </nav>
      </div>
    </main>

  </div>
</body>
</html>
