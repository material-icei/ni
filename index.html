<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isla de Aprender · Actividades para peques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#6FE0FA;
    --sky-bottom:#3AA8E0;
    --sun:#FFD23F;
    --sun-dark:#F5A623;
    --coral:#FF6F6F;
    --coral-dark:#E8524F;
    --grass:#46D98B;
    --grass-dark:#2FB874;
    --grape:#A374FF;
    --grape-dark:#8452E8;
    --cream:#FFFDF7;
    --ink:#2B3A55;
    --ink-soft:#5A6B8C;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
  }

  body{
    position:relative;
    width:100vw;
    height:100vh;
    aspect-ratio:16/9;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* -------- Escena -------- */
  .stage{
    position:relative;
    width:100%;
    height:100%;
    max-width:177.78vh; /* fuerza proporción 16:9 dentro de cualquier viewport */
    max-height:56.25vw;
    overflow:hidden;
  }

  /* -------- Fondo: sol, colinas, nubes -------- */
  .hill{
    position:absolute;
    bottom:-6%;
    left:0;
    width:100%;
    height:34%;
    background:var(--grass);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    transform:scale(1.3);
    opacity:0;
    animation:riseIn 0.7s cubic-bezier(.34,1.56,.64,1) 0.15s forwards;
  }
  .hill.back{
    background:var(--grass-dark);
    height:28%;
    bottom:-9%;
    transform:scale(1.5) translateX(6%);
    opacity:0.85;
    animation-delay:0.05s;
  }

  .sun{
    position:absolute;
    top:6%;
    right:9%;
    width:11%;
    aspect-ratio:1/1;
    opacity:0;
    animation:popIn 0.6s cubic-bezier(.34,1.56,.64,1) 0.05s forwards, floatSun 6s ease-in-out 0.9s infinite;
    filter:drop-shadow(0 6px 14px rgba(245,166,35,0.35));
  }

  .cloud{
    position:absolute;
    opacity:0;
    animation:fadeIn 0.6s ease forwards, driftCloud linear infinite;
  }
  .cloud svg{ width:100%; height:100%; display:block; }
  .cloud--1{ top:12%; left:6%; width:9%; animation-delay:0.2s, 0s; animation-duration:0.6s, 34s; }
  .cloud--2{ top:8%; left:38%; width:6.5%; animation-delay:0.35s, 0s; animation-duration:0.6s, 26s; }
  .cloud--3{ top:20%; left:70%; width:7.5%; animation-delay:0.5s, 0s; animation-duration:0.6s, 40s; }

  .star{
    position:absolute;
    opacity:0;
    animation:popIn 0.5s cubic-bezier(.34,1.56,.64,1) forwards, twinkle 2.6s ease-in-out infinite;
    transform-origin:center;
  }
  .star--1{ top:32%; left:14%; width:2.6%; animation-delay:0.9s, 1.5s; color:var(--cream); }
  .star--2{ top:14%; left:52%; width:2%; animation-delay:1.05s, 2.1s; color:var(--cream); }
  .star--3{ top:38%; left:82%; width:2.3%; animation-delay:1.15s, 0.8s; color:var(--cream); }

  /* -------- Encabezado -------- */
  .header{
    position:absolute;
    top:5%;
    left:0;
    width:100%;
    text-align:center;
    opacity:0;
    animation:dropIn 0.7s cubic-bezier(.34,1.56,.64,1) 0.15s forwards;
  }
  .header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(1.4rem, 4.2vw, 2.9rem);
    margin:0;
    color:var(--cream);
    text-shadow:0 3px 0 rgba(43,58,85,0.25);
    letter-spacing:0.5px;
  }
  .header p{
    font-weight:700;
    font-size:clamp(0.75rem, 1.5vw, 1.1rem);
    margin:0.4rem 0 0;
    color:var(--cream);
    opacity:0.92;
  }

  /* -------- Mascota -------- */
  .mascot{
    position:absolute;
    left:4.5%;
    bottom:16%;
    width:13%;
    opacity:0;
    animation:popIn 0.7s cubic-bezier(.34,1.56,.64,1) 0.5s forwards, bob 3.2s ease-in-out 1.2s infinite;
    transform-origin:bottom center;
  }
  .mascot svg{ width:100%; height:auto; display:block; overflow:visible; }
  .mascot .arm{ transform-origin: 60px 78px; animation:wave 1.8s ease-in-out 1.3s infinite; }

  .speech{
    position:absolute;
    left:16%;
    bottom:34%;
    background:var(--cream);
    color:var(--ink);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(0.7rem, 1.35vw, 1rem);
    padding:0.5em 0.9em;
    border-radius:16px;
    opacity:0;
    animation:popIn 0.5s cubic-bezier(.34,1.56,.64,1) 1.7s forwards;
    box-shadow:0 6px 0 rgba(43,58,85,0.15);
  }
  .speech::after{
    content:"";
    position:absolute;
    left:14px;
    bottom:-9px;
    border-width:10px 8px 0 0;
    border-style:solid;
    border-color:var(--cream) transparent transparent transparent;
  }

  /* -------- Islas / actividades -------- */
  .islands{
    position:absolute;
    bottom:6%;
    left:0;
    width:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4.5%;
    padding:0 6%;
  }

  .island{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    color:inherit;
    opacity:0;
    animation:riseIn 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .island--main{ width:23%; animation-delay:0.75s; }
  .island--soon{ width:16%; animation-delay:0.95s; }
  .island--soon:nth-of-type(3){ animation-delay:1.1s; }

  .island-card{
    width:100%;
    aspect-ratio:1/0.82;
    border-radius:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6%;
    position:relative;
    transition:transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease;
  }

  .island--main .island-card{
    background:var(--coral);
    box-shadow:0 10px 0 var(--coral-dark), 0 16px 24px rgba(0,0,0,0.18);
    cursor:pointer;
  }
  .island--main:hover .island-card,
  .island--main:focus-visible .island-card{
    transform:translateY(-6px) rotate(-1.5deg) scale(1.03);
  }
  .island--main:active .island-card{
    transform:translateY(0px);
    box-shadow:0 4px 0 var(--coral-dark), 0 8px 14px rgba(0,0,0,0.18);
  }
  .island--main:focus-visible{ outline:none; }
  .island--main:focus-visible .island-card{
    box-shadow:0 10px 0 var(--coral-dark), 0 0 0 5px var(--cream), 0 0 0 8px var(--coral-dark);
  }

  .island-icon{
    width:44%;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .island-icon svg{ width:100%; height:100%; }

  .island-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(0.95rem, 2vw, 1.5rem);
    color:var(--cream);
  }

  .island-tag{
    margin-top:0.5em;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(0.6rem, 1.1vw, 0.85rem);
    background:var(--sun);
    color:#5B4200;
    padding:0.25em 0.9em;
    border-radius:999px;
    box-shadow:0 3px 0 var(--sun-dark);
  }

  .island--soon .island-card{
    background:rgba(255,253,247,0.35);
    box-shadow:inset 0 0 0 3px rgba(255,253,247,0.55);
  }
  .island--soon .island-label{
    color:rgba(255,253,247,0.85);
    font-size:clamp(0.75rem, 1.5vw, 1.1rem);
  }
  .island--soon .island-icon{ opacity:0.75; }
  .island--soon{ cursor:default; }

  .lock-badge{
    position:absolute;
    top:-6%;
    right:-4%;
    width:26%;
    aspect-ratio:1/1;
    background:var(--grape);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 0 var(--grape-dark);
  }
  .lock-badge svg{ width:52%; height:52%; }

  /* -------- Animaciones -------- */
  @keyframes dropIn{
    0%{ opacity:0; transform:translateY(-24px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  @keyframes riseIn{
    0%{ opacity:0; transform:translateY(28px) scale(0.94); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes popIn{
    0%{ opacity:0; transform:scale(0.5); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes floatSun{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-3%) rotate(6deg); }
  }
  @keyframes driftCloud{
    0%{ transform:translateX(0); }
    50%{ transform:translateX(3.5vw); }
    100%{ transform:translateX(0); }
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.5; transform:scale(0.85) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.1) rotate(15deg); }
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4%); }
  }
  @keyframes wave{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(-22deg); }
  }
</style>
</head>
<body>
  <div class="stage">

    <!-- Fondo -->
    <div class="sun">
      <svg viewBox="0 0 100 100"><g fill="var(--sun)">
        <circle cx="50" cy="50" r="26"/>
        <g stroke="var(--sun)" stroke-width="7" stroke-linecap="round">
          <line x1="50" y1="6" x2="50" y2="16"/>
          <line x1="50" y1="84" x2="50" y2="94"/>
          <line x1="6" y1="50" x2="16" y2="50"/>
          <line x1="84" y1="50" x2="94" y2="50"/>
          <line x1="18" y1="18" x2="25" y2="25"/>
          <line x1="75" y1="75" x2="82" y2="82"/>
          <line x1="82" y1="18" x2="75" y2="25"/>
          <line x1="25" y1="75" x2="18" y2="82"/>
        </g>
      </g>
      <circle cx="42" cy="46" r="3.2" fill="#5B4200"/>
      <circle cx="58" cy="46" r="3.2" fill="#5B4200"/>
      <path d="M40 58 Q50 66 60 58" stroke="#5B4200" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="cloud cloud--1"><svg viewBox="0 0 100 60"><ellipse cx="28" cy="38" rx="26" ry="18" fill="#fff" opacity="0.95"/><ellipse cx="55" cy="28" rx="22" ry="20" fill="#fff" opacity="0.95"/><ellipse cx="76" cy="40" rx="20" ry="16" fill="#fff" opacity="0.95"/></svg></div>
    <div class="cloud cloud--2"><svg viewBox="0 0 100 60"><ellipse cx="28" cy="38" rx="26" ry="18" fill="#fff" opacity="0.9"/><ellipse cx="55" cy="28" rx="22" ry="20" fill="#fff" opacity="0.9"/><ellipse cx="76" cy="40" rx="20" ry="16" fill="#fff" opacity="0.9"/></svg></div>
    <div class="cloud cloud--3"><svg viewBox="0 0 100 60"><ellipse cx="28" cy="38" rx="26" ry="18" fill="#fff" opacity="0.95"/><ellipse cx="55" cy="28" rx="22" ry="20" fill="#fff" opacity="0.95"/><ellipse cx="76" cy="40" rx="20" ry="16" fill="#fff" opacity="0.95"/></svg></div>

    <div class="star star--1"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.9 8.3L24 12l-9.1 3.7L12 24l-2.9-8.3L0 12l9.1-3.7z"/></svg></div>
    <div class="star star--2"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.9 8.3L24 12l-9.1 3.7L12 24l-2.9-8.3L0 12l9.1-3.7z"/></svg></div>
    <div class="star star--3"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.9 8.3L24 12l-9.1 3.7L12 24l-2.9-8.3L0 12l9.1-3.7z"/></svg></div>

    <div class="hill back"></div>
    <div class="hill"></div>

    <!-- Encabezado -->
    <header class="header">
      <h1>La Isla de Aprender</h1>
      <p>¡Elige una isla y vamos a jugar!</p>
    </header>

    <!-- Mascota -->
    <div class="mascot" aria-hidden="true">
      <svg viewBox="0 0 120 130">
        <ellipse cx="60" cy="120" rx="30" ry="6" fill="rgba(43,58,85,0.15)"/>
        <circle cx="60" cy="70" r="42" fill="var(--grape)"/>
        <circle cx="46" cy="64" r="6" fill="#2B3A55"/>
        <circle cx="76" cy="64" r="6" fill="#2B3A55"/>
        <circle cx="48" cy="62" r="1.8" fill="#fff"/>
        <circle cx="78" cy="62" r="1.8" fill="#fff"/>
        <path d="M46 82 Q60 94 74 82" stroke="#2B3A55" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="34" cy="76" r="6" fill="#FF9E9E" opacity="0.7"/>
        <circle cx="86" cy="76" r="6" fill="#FF9E9E" opacity="0.7"/>
        <g class="arm">
          <path d="M92 78 Q112 70 108 48" stroke="var(--grape)" stroke-width="12" fill="none" stroke-linecap="round"/>
        </g>
        <path d="M28 78 Q18 92 26 108" stroke="var(--grape)" stroke-width="12" fill="none" stroke-linecap="round"/>
        <circle cx="60" cy="30" r="10" fill="var(--sun)"/>
      </svg>
    </div>
    <div class="speech">¡Hola! Empecemos con los números 🎉</div>

    <!-- Islas de actividades -->
    <nav class="islands" aria-label="Actividades disponibles">

      <a class="island island--main" href="numeracion/index.html">
        <div class="island-card">
          <div class="island-icon">
            <svg viewBox="0 0 100 100">
              <rect x="12" y="14" width="76" height="72" rx="14" fill="var(--cream)"/>
              <text x="50" y="66" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="46" text-anchor="middle" fill="var(--coral)">123</text>
            </svg>
          </div>
          <div class="island-label">Números</div>
        </div>
        <div class="island-tag">¡Jugar ahora!</div>
      </a>

      <div class="island island--soon">
        <div class="island-card">
          <div class="lock-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0110 0v3"/>
            </svg>
          </div>
          <div class="island-icon">
            <svg viewBox="0 0 100 100">
              <rect x="12" y="14" width="76" height="72" rx="14" fill="none" stroke="var(--cream)" stroke-width="4" stroke-dasharray="8 7" opacity="0.7"/>
              <text x="50" y="64" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="40" text-anchor="middle" fill="var(--cream)" opacity="0.75">ABC</text>
            </svg>
          </div>
          <div class="island-label">Letras</div>
        </div>
        <div class="island-tag" style="background:rgba(255,253,247,0.55); color:#5B4200; box-shadow:none;">Muy pronto</div>
      </div>

      <div class="island island--soon">
        <div class="island-card">
          <div class="lock-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0110 0v3"/>
            </svg>
          </div>
          <div class="island-icon">
            <svg viewBox="0 0 100 100">
              <rect x="12" y="14" width="76" height="72" rx="14" fill="none" stroke="var(--cream)" stroke-width="4" stroke-dasharray="8 7" opacity="0.7"/>
              <circle cx="38" cy="50" r="12" fill="var(--cream)" opacity="0.75"/>
              <rect x="56" y="38" width="24" height="24" rx="4" fill="var(--cream)" opacity="0.75"/>
            </svg>
          </div>
          <div class="island-label">Formas</div>
        </div>
        <div class="island-tag" style="background:rgba(255,253,247,0.55); color:#5B4200; box-shadow:none;">Muy pronto</div>
      </div>

    </nav>

  </div>
</body>
</html>
