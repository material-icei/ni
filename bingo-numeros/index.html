<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bingo de Números hasta el 30</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff6fa5; --orange:#ffa63e; --yellow:#ffd23f; --green:#3ecf8e;
    --blue:#3ea1ff; --purple:#b06fff; --red:#ff5c5c; --teal:#26c6c6;
    --cream:#fff8ec; --ink:#4a3b2b;
    --sw:1vw; --sh:1vh;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family:'Nunito', sans-serif; background:#2b2140;
    display:flex; align-items:center; justify-content:center;
  }
  #stage{
    position:relative;
    background:linear-gradient(160deg,#fff4e0 0%, #ffe9c7 40%, #ffd9e8 100%);
    overflow:hidden; border-radius: calc(var(--sh) * 1.2); box-shadow: 0 0 calc(var(--sh) * 4) rgba(0,0,0,0.5);
  }
  .screen{
    position:absolute; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    padding:calc(var(--sh) * 2) calc(var(--sw) * 3);
  }
  .screen.active{display:flex;}

  /* decorative floating background blobs */
  .bg-deco{position:absolute; font-size:calc(var(--sh) * 5); opacity:0.25; pointer-events:none; user-select:none;}

  h1.title{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    color:var(--purple); text-shadow: calc(var(--sh) * 0.3) calc(var(--sh) * 0.3) 0 #fff, calc(var(--sh) * 0.5) calc(var(--sh) * 0.5) 0 rgba(0,0,0,0.08);
    font-size:calc(var(--sh) * 6); margin:0 0 calc(var(--sh) * 2) 0; text-align:center; letter-spacing:calc(var(--sh) * 0.1);
    text-transform:uppercase;
  }

  /* ---------- SELECT SCREEN ---------- */
  #boardGrid{
    display:grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(2,1fr);
    gap:calc(var(--sh) * 1.6) calc(var(--sw) * 1.6); width:calc(var(--sw) * 88); height:calc(var(--sh) * 58);
  }
  .board-btn{
    border:none; border-radius:calc(var(--sh) * 1.6); cursor:pointer;
    font-family:'Baloo 2', sans-serif; font-weight:800; color:#fff;
    font-size:calc(var(--sh) * 3.4); display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow: 0 calc(var(--sh) * 0.6) 0 rgba(0,0,0,0.18), inset 0 calc(var(--sh) * -0.6) 0 rgba(0,0,0,0.12);
    transition: transform 0.12s ease;
    position:relative;
  }
  .board-btn:active{ transform: scale(0.92); }
  .board-btn .emoji{font-size:calc(var(--sh) * 3.4); margin-bottom:calc(var(--sh) * 0.3);}
  .board-btn .num{font-size:calc(var(--sh) * 2.6);}

  /* ---------- GAME SCREEN ---------- */
  #gameScreen{ justify-content:flex-start; padding-top:calc(var(--sh) * 1.4); }
  #topBar{
    width:calc(var(--sw) * 94); display:flex; align-items:center; justify-content:space-between;
    margin-bottom:calc(var(--sh) * 1);
  }
  #backBtn, #resetBtn{
    border:none; border-radius:50%; width:calc(var(--sh) * 6.4); height:calc(var(--sh) * 6.4);
    font-size:calc(var(--sh) * 3.2); background:var(--yellow); box-shadow:0 calc(var(--sh) * 0.5) 0 rgba(0,0,0,0.18);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #resetBtn{ background:var(--teal); }
  #gameTitle{
    font-family:'Baloo 2', sans-serif; font-weight:800; color:var(--purple);
    font-size:calc(var(--sh) * 3.6); text-align:center; flex:1;
  }
  #gameTitle .badge{
    display:inline-block; background:var(--pink); color:#fff; border-radius:calc(var(--sh) * 2);
    padding:calc(var(--sh) * 0.3) calc(var(--sw) * 1.6); font-size:calc(var(--sh) * 2.6); margin-left:calc(var(--sw) * 1);
  }

  #board{
    display:grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(3, 1fr);
    gap:calc(var(--sh) * 0.9) calc(var(--sw) * 0.9); width:calc(var(--sw) * 92); height:calc(var(--sh) * 62); background:#fff; border-radius:calc(var(--sh) * 2);
    padding:calc(var(--sh) * 1.4) calc(var(--sw) * 1.4); box-shadow: 0 calc(var(--sh) * 0.8) 0 rgba(0,0,0,0.1), inset 0 0 0 calc(var(--sh) * 0.4) #ffe4c4;
  }
  .row-wrap{ display:contents; }
  .cell{
    border-radius:calc(var(--sh) * 1.4); display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:calc(var(--sh) * 4.6); color:#fff;
    position:relative; user-select:none; transition: transform 0.15s ease, filter 0.15s ease;
    box-shadow: inset 0 calc(var(--sh) * -0.5) 0 rgba(0,0,0,0.15);
  }
  .cell.number{ cursor:pointer; }
  .cell.number:active{ transform:scale(0.93); }
  .cell.deco{ background:#fff3e0; color:#000; font-size:calc(var(--sh) * 3.6); box-shadow:none; opacity:0.85; }
  .cell.marked{ filter:brightness(0.75) saturate(1.3); }
  .cell.marked::after{
    content:"✔️"; position:absolute; font-size:calc(var(--sh) * 3.4); top:50%; left:50%;
    transform:translate(-50%,-50%); background:rgba(255,255,255,0.0);
  }
  .cell.marked .num-label{ opacity:0.35; }
  .cell.number.row-complete-cell{
    box-shadow: 0 0 0 calc(var(--sh) * 0.5) #fff, 0 0 calc(var(--sh) * 2) calc(var(--sh) * 0.6) var(--yellow);
    animation: rowGlow 1s ease-in-out infinite alternate;
  }
  @keyframes rowGlow{
    from{ box-shadow: 0 0 0 calc(var(--sh) * 0.4) #fff, 0 0 calc(var(--sh) * 1.2) calc(var(--sh) * 0.4) var(--yellow); }
    to{ box-shadow: 0 0 0 calc(var(--sh) * 0.6) #fff, 0 0 calc(var(--sh) * 3) calc(var(--sh) * 0.9) var(--orange); }
  }

  /* ---------- MODAL ---------- */
  #modalOverlay{
    position:absolute; inset:0; background:rgba(43,33,64,0.55);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  #modalOverlay.active{ display:flex; }
  #modalCard{
    background:#fff; border-radius:calc(var(--sh) * 3); padding:calc(var(--sh) * 3) calc(var(--sw) * 5); text-align:center;
    box-shadow:0 calc(var(--sh) * 1) 0 rgba(0,0,0,0.15); max-width:calc(var(--sw) * 70);
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn{ from{ transform:scale(0.4); opacity:0;} to{ transform:scale(1); opacity:1;} }
  #modalEmoji{ font-size:calc(var(--sh) * 9); display:block; margin-bottom:calc(var(--sh) * 1); }
  #modalText{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:calc(var(--sh) * 5.4); margin:0 0 calc(var(--sh) * 2) 0;
    text-transform:uppercase;
  }
  #modalText.line{ color:var(--blue); }
  #modalText.bingo{ color:var(--red); }
  #modalBtn{
    border:none; border-radius:calc(var(--sh) * 2); padding:calc(var(--sh) * 1.4) calc(var(--sw) * 4); font-size:calc(var(--sh) * 2.8); font-weight:800;
    font-family:'Baloo 2', sans-serif; color:#fff; background:var(--green); cursor:pointer;
    box-shadow:0 calc(var(--sh) * 0.5) 0 rgba(0,0,0,0.2);
  }

  /* confetti */
  .confetti{
    position:absolute; top:calc(var(--sh) * -3); width:calc(var(--sw) * 1.4); height:calc(var(--sh) * 2.4); border-radius:calc(var(--sh) * 0.4);
    animation: fall linear forwards; z-index:60; pointer-events:none;
  }
  @keyframes fall{
    to{ transform: translateY(calc(var(--sh) * 115)) rotate(540deg); opacity:0.9; }
  }
</style>
</head>
<body>
<div id="stage">

  <!-- floating decorations -->
  <div class="bg-deco" style="top:3%; left:4%;">🎈</div>
  <div class="bg-deco" style="top:8%; right:6%;">⭐</div>
  <div class="bg-deco" style="bottom:6%; left:8%;">🌈</div>
  <div class="bg-deco" style="bottom:4%; right:10%;">🎉</div>

  <!-- SELECT SCREEN -->
  <div id="selectScreen" class="screen active">
    <h1 class="title">🎲 Bingo de Números 🎲</h1>
    <div id="boardGrid"></div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <div id="topBar">
      <button id="backBtn" title="Volver">↩️</button>
      <div id="gameTitle">🎫 Mi tablero <span class="badge" id="boardNumLabel">1</span></div>
      <button id="resetBtn" title="Reiniciar">🔄</button>
    </div>
    <div id="board"></div>
  </div>

  <!-- MODAL -->
  <div id="modalOverlay">
    <div id="modalCard">
      <span id="modalEmoji">🎉</span>
      <p id="modalText" class="line">¡LÍNEA!</p>
      <button id="modalBtn">¡Genial! 😄</button>
    </div>
  </div>

</div>

<script>
/* ---------------- STAGE SCALING (16:9) ---------------- */
function resizeStage(){
  const stage = document.getElementById('stage');
  const winW = window.innerWidth, winH = window.innerHeight;
  const targetRatio = 16/9;
  let w, h;
  if (winW / winH > targetRatio){
    h = winH * 0.98; w = h * targetRatio;
  } else {
    w = winW * 0.98; h = w / targetRatio;
  }
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  // --sw / --sh = 1% del ancho/alto REAL del stage, para que todas las medidas
  // internas (antes en vw/vh) queden siempre contenidas dentro del stage,
  // sin importar la proporción de la ventana del navegador.
  document.documentElement.style.setProperty('--sw', (w / 100) + 'px');
  document.documentElement.style.setProperty('--sh', (h / 100) + 'px');
}
window.addEventListener('resize', resizeStage);
resizeStage();

/* ---------------- SEEDED RNG ---------------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffleWithRand(arr, rand){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const CELL_COLORS = ['#ff6fa5','#ffa63e','#ffd23f','#3ecf8e','#3ea1ff','#b06fff','#ff5c5c','#26c6c6'];
const DECO_EMOJIS = ['🌟','🌈','🎈','🌸','💫','🦋','🍀','☀️','🍭','🐝'];
const PICK_EMOJIS = ['🦄','🐬','🐸','🦋','🐝','🦊','🐼','🐳','🦉','🐙','🦁','🐧','🐢','🦖','🐠','🐨'];

/* ---------------- BOARD GENERATION ---------------- */
function generateBoard(seed){
  const rand = mulberry32(seed * 977 + 13);
  const shuffled = shuffleWithRand(Array.from({length:30}, (_,i)=>i+1), rand);
  const chosen = shuffled.slice(0, 21);
  const rows = [
    chosen.slice(0,7).sort((a,b)=>a-b),
    chosen.slice(7,14).sort((a,b)=>a-b),
    chosen.slice(14,21).sort((a,b)=>a-b)
  ];
  const board = [];
  rows.forEach(rowNums => {
    const cols = shuffleWithRand([0,1,2,3,4,5,6,7,8], rand);
    const blankCols = new Set(cols.slice(0,2));
    const rowCells = new Array(9);
    let idx = 0;
    for (let c=0;c<9;c++){
      if (blankCols.has(c)){
        rowCells[c] = { type:'deco', emoji: DECO_EMOJIS[Math.floor(rand()*DECO_EMOJIS.length)] };
      } else {
        rowCells[c] = { type:'number', value: rowNums[idx++] };
      }
    }
    board.push(rowCells);
  });
  return board;
}

/* ---------------- STATE ---------------- */
let currentBoardIndex = null;
let currentBoard = null;
let markedSet = new Set();
let lineDone = [false,false,false];
let bingoDone = false;

/* ---------------- SELECT SCREEN RENDER ---------------- */
const boardGrid = document.getElementById('boardGrid');
for (let i=1;i<=16;i++){
  const btn = document.createElement('button');
  btn.className = 'board-btn';
  btn.style.background = CELL_COLORS[(i-1) % CELL_COLORS.length];
  btn.innerHTML = `<span class="emoji">${PICK_EMOJIS[i-1]}</span><span class="num">${i}</span>`;
  btn.addEventListener('click', () => openBoard(i));
  boardGrid.appendChild(btn);
}

/* ---------------- GAME SCREEN RENDER ---------------- */
const boardEl = document.getElementById('board');
function openBoard(index){
  currentBoardIndex = index;
  currentBoard = generateBoard(index);
  markedSet = new Set();
  lineDone = [false,false,false];
  bingoDone = false;
  document.getElementById('boardNumLabel').textContent = index;
  renderBoard();
  showScreen('gameScreen');
}

function renderBoard(){
  boardEl.innerHTML = '';
  currentBoard.forEach((row, r) => {
    row.forEach((cell, c) => {
      const div = document.createElement('div');
      const key = r + '-' + c;
      if (cell.type === 'number'){
        div.className = 'cell number';
        div.style.background = CELL_COLORS[cell.value % CELL_COLORS.length];
        div.innerHTML = `<span class="num-label">${cell.value}</span>`;
        if (markedSet.has(key)) div.classList.add('marked');
        div.addEventListener('click', () => toggleCell(r, c, key));
      } else {
        div.className = 'cell deco';
        div.textContent = cell.emoji;
      }
      boardEl.appendChild(div);
    });
  });
  applyRowHighlights();
}

function applyRowHighlights(){
  const cells = document.querySelectorAll('#board .cell');
  for (let r=0;r<3;r++){
    for (let c=0;c<9;c++){
      const el = cells[r*9+c];
      if (!el) continue;
      const cellData = currentBoard[r][c];
      if (cellData.type === 'number'){
        el.classList.toggle('row-complete-cell', lineDone[r]);
      }
    }
  }
}

function toggleCell(r, c, key){
  if (markedSet.has(key)) markedSet.delete(key);
  else markedSet.add(key);
  renderBoard();
  checkLines();
}

function checkLines(){
  for (let r=0;r<3;r++){
    if (lineDone[r]) continue;
    const allMarked = currentBoard[r].every((cell, colIndex) => {
      if (cell.type !== 'number') return true;
      return markedSet.has(r + '-' + colIndex);
    });
    if (allMarked){
      lineDone[r] = true;
      applyRowHighlights();
      showModal('¡LÍNEA!', '🎯', 'line');
    }
  }
  checkBingo();
}

function checkBingo(){
  if (bingoDone) return;
  const totalNumbers = currentBoard.flat().filter(c => c.type === 'number').length;
  if (markedSet.size >= totalNumbers){
    bingoDone = true;
    showModal('¡BINGO!', '🏆', 'bingo');
    launchConfetti();
  }
}

/* ---------------- MODAL ---------------- */
const modalOverlay = document.getElementById('modalOverlay');
const modalText = document.getElementById('modalText');
const modalEmoji = document.getElementById('modalEmoji');
function showModal(text, emoji, kind){
  modalText.textContent = text;
  modalText.className = kind;
  modalEmoji.textContent = emoji;
  modalOverlay.classList.add('active');
}
document.getElementById('modalBtn').addEventListener('click', () => {
  modalOverlay.classList.remove('active');
});

/* ---------------- CONFETTI ---------------- */
function launchConfetti(){
  const stage = document.getElementById('stage');
  const colors = CELL_COLORS;
  for (let i=0;i<70;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti';
    piece.style.left = Math.random()*100 + '%';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (2 + Math.random()*1.8) + 's';
    piece.style.animationDelay = (Math.random()*0.6) + 's';
    stage.appendChild(piece);
    setTimeout(() => piece.remove(), 4500);
  }
}

/* ---------------- NAVIGATION ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.getElementById('backBtn').addEventListener('click', () => {
  showScreen('selectScreen');
});
document.getElementById('resetBtn').addEventListener('click', () => {
  markedSet = new Set();
  lineDone = [false,false,false];
  bingoDone = false;
  renderBoard();
});
</script>
</body>
</html>
